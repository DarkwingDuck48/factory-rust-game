# Каталог всех ресурсов (Т0 и производных).
# Строки-имена не храним: только code (по умолчанию resource.<id>)
# и перевод в lang/ru.toml. Тир в каталоге не хранится — вычисляется
# из рецептов (Т0 = ресурсы без добывающих входов, добыча tier = 0).

[wood]                  # Т0 — с начала игры
category = "material"
icon = "W"
